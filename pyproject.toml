[project]
name = "payflow"
version = "0.1.0"
description = "Event-driven payment and order processing backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.15,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.2,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.28,<1.0",
  "email-validator>=2.2,<3.0",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "aiosqlite>=0.20,<1.0",
]
[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["app"]